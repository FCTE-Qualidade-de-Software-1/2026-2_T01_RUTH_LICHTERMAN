name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  issues:
    types: [closed, reopened]
  schedule:
    - cron: "0 */3 * * *"   # a cada 3 horas, para manter o painel PSM atualizado
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r scripts/requirements-psm.txt
      - name: Atualizar painel PSM/CID a partir das issues
        run: python scripts/coleta_psm.py
        continue-on-error: true   # se a API falhar, publica o último painel commitado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
