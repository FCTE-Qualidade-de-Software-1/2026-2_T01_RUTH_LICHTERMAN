site_name: Projeto de Qualidade de Software
site_description: Documentação das entregas da disciplina de Qualidade de Software
site_author: RUTH LICHTERMAN
site_url: https://fcte-qualidade-de-software-1.github.io/2026-2_T01_RUTH_LICHTERMAN/

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/chart-box-outline
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Ativar modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - Artigo:
      - Introdução: artigo/introducao.md
      - Referencial Teórico: artigo/referencial-teorico.md
      - Metodologia: artigo/metodologia.md
  - Fase 1:
      - Visão geral: fase-1/index.md
      - Descrição do Produto: fase-1/1-descricao.md
      - Propósito, Justificativa e Objetivos: fase-1/2-proposito.md
      - Modelo de Qualidade: fase-1/3-modelo.md
  - Fase 2 — GQM:
      - Visão geral: fase-2/index.md
      - Objetivos de Medição: fase-2/objetivos.md
      - Questões: fase-2/questoes.md
      - Hipóteses: fase-2/hipoteses.md
      - Métricas: fase-2/metricas.md
      - Níveis de Pontuação: fase-2/niveis-pontuacao.md
      - Gráfico GQM: fase-2/grafico-gqm.md
  - Gestão:
      - PSM/CID: gestao/psm.md
      - Painel PSM (automático): gestao/painel.md
  - Uso de IA: uso-de-ia.md
  - Equipe: contribuicao.md
  - Referências: referencias.md
